<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Woolworths Group Casual Careers</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "JobPosting",
    "title": "Customer Service Team Member - Supermarket",
    "hiringOrganization": {
      "@type": "Organization",
      "name": "Woolworths Supermarkets"
    },
    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Melbourne",
        "addressRegion": "VIC",
        "addressCountry": "AU"
      }
    },
    "baseSalary": {
      "@type": "MonetaryAmount",
      "currency": "AUD",
      "value": {
        "@type": "QuantitativeValue",
        "minValue": 28.50,
        "maxValue": 32.00,
        "unitText": "HOUR"
      }
    },
    "employmentType": "PART_TIME",
    "datePosted": "2026-10-01",
    "description": "Join our checkout team in Melbourne CBD. Flexible casual shifts available up to 20 hours per week for international students."
  }
  </script>
</head>
<body>
  <h1>Woolworths Careers</h1>
  <p>Search results for retail team members</p>
</body>
</html>
